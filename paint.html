<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>インク・ルーツ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=M+PLUS+1p:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root { --orange: #ff7a00; --blue: #2f6bff; --glass: rgba(8, 12, 24, .55); --line: rgba(255,255,255,.14); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; font-family: "M PLUS 1p", system-ui, "Hiragino Sans", sans-serif; color: #fff; user-select: none; }
  canvas#game { display: block; }
  .num { font-family: "Orbitron", system-ui, sans-serif; }
  .hud { position: fixed; pointer-events: none; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #cross { left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; transition: transform .08s; }
  #cross.hit { transform: scale(1.25); }
  #cross.hit .tick { stroke: #fff200; }
  #top { top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 8px 16px; }
  #scorebar { position: relative; width: 380px; max-width: 42vw; height: 14px; border-radius: 7px; overflow: hidden; display: flex; background: rgba(255,255,255,.12); }
  #scoreA { background: linear-gradient(90deg,#ff5a00,#ffa040); box-shadow: 0 0 14px var(--orange); }
  #scoreB { background: linear-gradient(90deg,#5b8cff,#1f4fff); box-shadow: 0 0 14px var(--blue); margin-left: auto; }
  .pct { font-size: 22px; font-weight: 900; min-width: 54px; text-align: center; }
  #pctA { color: #ffa24d; text-shadow: 0 0 12px rgba(255,122,0,.7); } #pctB { color: #7ea2ff; text-shadow: 0 0 12px rgba(47,107,255,.7); }
  #timer { font-size: 24px; font-weight: 900; padding-left: 14px; border-left: 1px solid var(--line); letter-spacing: 1px; }
  #mapbox { right: 14px; top: 14px; padding: 6px; }
  #minimap { display: block; width: 240px; height: 160px; border-radius: 8px; }
  #feed { right: 16px; top: 196px; text-align: right; font-size: 14px; font-weight: 800; line-height: 1.8; text-shadow: 0 2px 6px #000; }
  #status { left: 16px; bottom: 16px; width: 260px; padding: 12px 14px; }
  .lbl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: 1px; opacity: .85; }
  .bar { height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
  .bar div { height: 100%; width: 100%; border-radius: 4px; }
  #hpfill { background: linear-gradient(90deg,#27e38a,#9dffc8); box-shadow: 0 0 10px #27e38a; }
  #inkfill { background: linear-gradient(90deg,#ff5a00,#ffb060); box-shadow: 0 0 10px var(--orange); }
  #spfill { background: linear-gradient(90deg,#b6ff00,#00ffc8); box-shadow: 0 0 10px #7dffb0; }
  #spfill.full { animation: pulse .6s infinite alternate; }
  #supfill { background: linear-gradient(90deg,#ffe066,#ff66c4,#66e0ff); box-shadow: 0 0 10px #ffd000; width: 0; }
  #supfill.ready { animation: pulse .5s infinite alternate; }
  #supnum { font-weight: 900; white-space: nowrap; }
  @media (max-width: 1350px) { #weapon { display: none !important; } }   /* 狭い画面では建築バーと重ならないよう説明を隠す */
  #buildbar { left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; }
  .bslot { position: relative; width: 58px; padding: 4px 2px; border-radius: 10px; text-align: center; font-size: 10px; font-weight: 800; background: rgba(255,255,255,.06); border: 2px solid transparent; }
  .bslot b { display: block; font-size: 22px; line-height: 1.2; }
  .bslot i { position: absolute; left: 4px; top: 2px; font-style: normal; font-size: 10px; opacity: .6; }
  .bslot em { display: block; font-style: normal; font-size: 9px; opacity: .85; white-space: nowrap; }
  .bslot.sel { border-color: #b6ff00; background: rgba(182,255,0,.18); }
  .bslot.no { opacity: .45; }
  .bslot.mat { width: 52px; background: rgba(255,210,120,.15); }
  body.touch #buildbar { pointer-events: auto; bottom: 6px; gap: 3px; padding: 4px; z-index: 6; }
  body.touch .bslot { width: 42px; font-size: 8px; }
  body.touch .bslot b { font-size: 18px; }
  body.touch .bslot i, body.touch .bslot em { display: none; }
  #suplbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62%; }
  @keyframes pulse { to { filter: brightness(1.8); } }
  #weapon { right: 16px; bottom: 16px; padding: 12px 16px; text-align: right; font-size: 13px; line-height: 1.8; }
  #weapon .wname { font-size: 22px; font-weight: 900; }
  #toast { top: 24%; left: 50%; transform: translateX(-50%); font-size: 48px; font-weight: 900; opacity: 0; transition: opacity .25s; white-space: nowrap; text-shadow: 0 0 24px rgba(0,0,0,.8), 0 2px 0 #000; letter-spacing: 2px; }
  #vignette { inset: 0; background: radial-gradient(ellipse at center, transparent 50%, rgba(255,40,40,.5)); opacity: 0; transition: opacity .15s; }
  html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  canvas#game { touch-action: none; }
  /* ===== スマホ用タッチ操作 ===== */
  #touchui { display: none; }
  body.touch.playing #touchui { display: block; }
  .tbtn, #joy { position: fixed; touch-action: none; user-select: none; -webkit-user-select: none; z-index: 5; }
  #joy { left: calc(28px + env(safe-area-inset-left)); bottom: 28px; width: 132px; height: 132px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.18)); border: 2px solid rgba(255,255,255,.3); }
  #knob { position: absolute; left: 41px; top: 41px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .tbtn { display: flex; align-items: center; justify-content: center; flex-direction: column; border-radius: 50%; color: #fff; font-weight: 900; font-size: 11px;
    background: rgba(10,14,28,.5); border: 2px solid rgba(255,255,255,.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .tbtn b { font-size: 22px; line-height: 1.1; }
  .tbtn.on { background: rgba(255,122,0,.55); border-color: #ffb066; transform: scale(.94); }
  #tFire { right: calc(26px + env(safe-area-inset-right)); bottom: 34px; width: 96px; height: 96px; border-width: 3px; }
  #tBomb { right: calc(134px + env(safe-area-inset-right)); bottom: 22px; width: 62px; height: 62px; }
  #tDive { right: calc(132px + env(safe-area-inset-right)); bottom: 96px; width: 62px; height: 62px; }
  #tJump { right: calc(40px + env(safe-area-inset-right)); bottom: 142px; width: 62px; height: 62px; }
  #tSp { right: calc(112px + env(safe-area-inset-right)); bottom: 170px; width: 56px; height: 56px; }
  #tSuper { right: calc(186px + env(safe-area-inset-right)); bottom: 150px; width: 56px; height: 56px; opacity: .55; }
  #tSuper.ready { opacity: 1; border-color: #ffe066; box-shadow: 0 0 20px #ffc400; animation: pulse .5s infinite alternate; }
  #tSp.ready { border-color: #b6ff00; box-shadow: 0 0 18px #7dff00; animation: pulse .6s infinite alternate; }
  #tPause { left: calc(10px + env(safe-area-inset-left)); top: 10px; width: 40px; height: 40px; border-radius: 12px; font-size: 16px; }
  body.touch #weapon { display: none !important; }
  body.touch #status { left: auto; right: auto; top: 58px; bottom: auto; left: calc(10px + env(safe-area-inset-left)); width: 140px; padding: 6px 10px; }
  body.touch #status .bar { margin: 2px 0 5px; height: 6px; }
  body.touch .lbl { font-size: 10px; }
  body.touch #top { top: 8px; left: 50%; transform: translateX(-50%); padding: 4px 10px; gap: 8px; }
  body.touch #scorebar { width: 110px; height: 10px; }
  body.touch .pct { font-size: 15px; min-width: 38px; }
  body.touch #timer { font-size: 16px; padding-left: 8px; }
  body.touch #mapbox { top: 8px; right: calc(8px + env(safe-area-inset-right)); padding: 4px; }
  body.touch #minimap { width: 132px; height: 88px; }
  body.touch #feed { top: 108px; font-size: 11px; }
  body.touch #toast { font-size: 28px !important; }
  #rotate { display: none; position: fixed; left: 50%; top: 42%; transform: translateX(-50%); z-index: 20; pointer-events: none;
    background: rgba(0,0,0,.7); padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  @media (orientation: portrait) { body.touch.playing #rotate { display: block; } }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; text-align: center; z-index: 10;
    background: linear-gradient(180deg, rgba(3,6,14,.2), rgba(3,6,14,.85) 70%); padding: 16px; overflow-y: auto; }
  .logo-en { font-family: "Orbitron", sans-serif; font-weight: 900; letter-spacing: 12px; font-size: 16px; opacity: .8; margin-bottom: 4px; }
  #overlay h1 { font-size: 72px; font-weight: 900; margin: 0; line-height: 1.05; letter-spacing: 4px;
    background: linear-gradient(95deg,#ff7a00 10%,#fff 50%,#2f6bff 90%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 20px rgba(0,0,0,.6)); }
  .tag { font-size: 18px; margin: 8px 0 18px; letter-spacing: 4px; opacity: .9; }
  .rule { max-width: 680px; padding: 12px 20px; font-size: 14px; line-height: 1.8; text-align: left; }
  .rule b { color: #b6ff00; }
  .cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .card { width: 200px; padding: 16px; cursor: pointer; text-align: left; transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover { transform: translateY(-5px); border-color: var(--orange); box-shadow: 0 0 30px rgba(255,122,0,.35); }
  .card .en { font-family: "Orbitron", sans-serif; font-size: 11px; letter-spacing: 3px; color: #ffa24d; }
  .card h2 { margin: 2px 0 6px; font-size: 22px; }
  .card p { margin: 0 0 10px; font-size: 12px; opacity: .8; line-height: 1.6; min-height: 58px; }
  .stat { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 6px; font-size: 11px; margin: 3px 0; opacity: .9; }
  .stat i { display: block; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .stat i b { display: block; height: 100%; background: linear-gradient(90deg,#ff7a00,#ffd000); }
  .keys { margin-top: 16px; font-size: 12px; opacity: .75; line-height: 1.8; }
  .btn { display: inline-block; margin: 18px 8px 0; background: linear-gradient(90deg,#ff5a00,#ff9a2e); padding: 12px 34px; border-radius: 12px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 0 24px rgba(255,122,0,.4); }
  .btn.sub { background: rgba(255,255,255,.12); box-shadow: none; border: 1px solid var(--line); }
  .result { display: flex; gap: 40px; font-size: 30px; font-weight: 900; margin: 18px 0; }
  @media (max-width: 1150px) { #top { left: 16px; transform: none; } #scorebar { width: 180px; } #status { width: 200px; } }
  .online { margin-top: 18px; padding: 14px 18px; max-width: 660px; }
  .online .en, .code-box .en { font-family: "Orbitron", sans-serif; font-size: 12px; letter-spacing: 4px; color: #b6ff00; margin-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
  .row .btn { margin: 0; font-size: 16px; padding: 9px 20px; }
  .row label, .or { font-size: 13px; opacity: .8; }
  input { font: inherit; font-size: 16px; font-weight: 800; color: #fff; background: rgba(255,255,255,.1); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; outline: none; width: 160px; }
  input:focus { border-color: #ff7a00; }
  .hint { font-size: 12px; opacity: .7; margin-top: 6px; }
  .code-box { padding: 12px 30px; margin-bottom: 14px; }
  .code { font-size: 56px; font-weight: 900; letter-spacing: 14px; color: #fff; text-shadow: 0 0 24px rgba(182,255,0,.6); }
  .players { padding: 10px 16px; min-width: 320px; text-align: left; }
  .pl { display: flex; align-items: center; gap: 10px; font-weight: 800; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .pl:last-child { border-bottom: 0; }
  .pl .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }
  .pl .w { margin-left: auto; font-size: 12px; opacity: .7; }
  .card.sel { border-color: #b6ff00; box-shadow: 0 0 30px rgba(182,255,0,.35); }
  .ranking { font-size: 14px; line-height: 1.8; min-width: 280px; padding: 8px 16px; margin-top: 10px; text-align: left; }
  .big { font-family: "Orbitron", sans-serif; font-size: 96px; font-weight: 900; letter-spacing: 8px; line-height: 1; }
  @media (max-width: 900px), (max-height: 500px) {
    #overlay h1 { font-size: 40px; }
    .logo-en { font-size: 12px; letter-spacing: 8px; }
    .tag { font-size: 14px; margin: 4px 0 10px; }
    .rule { font-size: 12px; padding: 8px 12px; }
    .cards { gap: 8px; margin-top: 10px; }
    .card { width: 150px; padding: 10px; }
    .card h2 { font-size: 17px; }
    .card p { font-size: 11px; min-height: 0; }
    .code { font-size: 40px; }
    .big { font-size: 56px; }
    .online { margin-top: 10px; padding: 8px 12px; }
    .keys { font-size: 11px; margin-top: 8px; }
    .stat { font-size: 10px; }
    .result { font-size: 20px; gap: 20px; }
  }
</style>
<!-- 外部プログラムは「改ざんされていないか」をハッシュ値で確認してから使う（SRI） -->

<body>
<div class="hud" id="vignette"></div>
<svg class="hud" id="cross" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="3"/>
  <circle id="inkring" cx="32" cy="32" r="22" fill="none" stroke="#ff7a00" stroke-width="3" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0" transform="rotate(-90 32 32)"/>
  <g class="tick" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="20" x2="32" y2="26"/><line x1="32" y1="38" x2="32" y2="44"/><line x1="20" y1="32" x2="26" y2="32"/><line x1="38" y1="32" x2="44" y2="32"/>
  </g>
  <circle cx="32" cy="32" r="1.8" fill="#fff"/>
</svg>
<div class="hud glass" id="top">
  <div class="pct num" id="pctA">0%</div>
  <div id="scorebar"><div id="scoreA"></div><div id="scoreB"></div></div>
  <div class="pct num" id="pctB">0%</div>
  <div class="num" id="timer">2:30</div>
</div>
<div class="hud glass" id="mapbox"><canvas id="minimap" width="240" height="160"></canvas></div>
<div class="hud" id="feed"></div>
<div class="hud glass" id="status">
  <div class="lbl"><span>HP</span><span class="num" id="hpnum">100</span></div><div class="bar"><div id="hpfill"></div></div>
  <div class="lbl"><span>インク</span><span class="num" id="inknum">100</span></div><div class="bar"><div id="inkfill"></div></div>
  <div class="lbl"><span>スペシャル [E]</span><span class="num" id="spnum">0</span></div><div class="bar"><div id="spfill"></div></div>
  <div class="lbl" style="margin-bottom:6px"><span>🪵 木材 <b class="num" id="woodnum">30</b></span><span>🪨 石 <b class="num" id="stonenum">20</b></span></div>
  <div class="lbl"><span id="suplbl">🎁 SP武器 [F]</span><span id="supnum">あと3キル</span></div><div class="bar" style="margin-bottom:0"><div id="supfill"></div></div>
</div>
<div class="hud glass" id="weapon"></div>
<div class="hud glass" id="buildbar"></div>
<div class="hud" id="toast"></div>
<div id="touchui">
  <div id="joy"><div id="knob"></div></div>
  <div class="tbtn" id="tFire"><b>🎯</b>撃つ</div>
  <div class="tbtn" id="tBomb"><b>💣</b>ボム</div>
  <div class="tbtn" id="tDive"><b>💧</b>ダイブ</div>
  <div class="tbtn" id="tJump"><b>⤴</b>ジャンプ</div>
  <div class="tbtn" id="tSp"><b>🌱</b>SP</div>
  <div class="tbtn" id="tSuper"><b>🎁</b>武器</div>
  <div class="tbtn" id="tPause">⏸</div>
</div>
<div id="rotate">📱 横向きにすると遊びやすいよ</div>
<div id="overlay"></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ================= レンダラーと光 =================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.domElement.id = 'game';
const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
if (isTouch) document.body.classList.add('touch');
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1 : 1.5));   // スマホは軽さ優先
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();

let actx = null, noiseBuf = null;
function initAudio() {
  if (actx) return;
  actx = new AudioContext();
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(freq, dur, vol, type = 'sine', to = freq, delay = 0) {
  if (!actx || vol < 0.004) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, freq, vol) {
  if (!actx || vol < 0.004) return;
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(actx.destination); s.start(t, rand() * 0.5); s.stop(t + dur);
}
const volAt = (pos, base) => player ? base / (1 + pos.distanceTo(player.pos) * 0.15) : 0;

// ================= 手続き生成テクスチャ =================
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function tileNoise(x, y, f) {   // 繰り返してもつなぎ目が出ないノイズ
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const h = (a, b) => hash2(((a % f) + f) % f, ((b % f) + f) % f);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return (h(xi, yi) * (1 - u) + h(xi + 1, yi) * u) * (1 - v) + (h(xi, yi + 1) * (1 - u) + h(xi + 1, yi + 1) * u) * v;
}
function fbm(x, y, size, octaves = 5, base = 4) {
  let n = 0, amp = 0.5;
  for (let o = 0; o < octaves; o++) { const f = base << o; n += tileNoise(x / size * f, y / size * f, f) * amp; amp *= 0.5; }
  return n;
}
// shade(x, y) が [r, g, b, 高さ] を返す。色の絵と、でこぼこ（ノーマルマップ）を一緒に作る
function makeTextures(size, shade, normalStrength = 2) {
  const hgt = new Float32Array(size * size);
  const col = document.createElement('canvas'); col.width = col.height = size;
  const g = col.getContext('2d'), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const [r, gg, b, h] = shade(x, y);
    hgt[y * size + x] = h;
    const p = (y * size + x) * 4;
    img.data[p] = r; img.data[p + 1] = gg; img.data[p + 2] = b; img.data[p + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const nrm = document.createElement('canvas'); nrm.width = nrm.height = size;
  const ng = nrm.getContext('2d'), nimg = ng.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const hl = hgt[y * size + (x - 1 + size) % size], hr = hgt[y * size + (x + 1) % size];
    const hu = hgt[((y - 1 + size) % size) * size + x], hd = hgt[((y + 1) % size) * size + x];
    const v = new V3((hl - hr) * normalStrength, (hu - hd) * normalStrength, 1).normalize();
    const p = (y * size + x) * 4;
    nimg.data[p] = (v.x * 0.5 + 0.5) * 255; nimg.data[p + 1] = (v.y * 0.5 + 0.5) * 255; nimg.data[p + 2] = (v.z * 0.5 + 0.5) * 255; nimg.data[p + 3] = 255;
  }
  ng.putImageData(nimg, 0, 0);
  const map = new THREE.CanvasTexture(col), normalMap = new THREE.CanvasTexture(nrm);
  map.colorSpace = THREE.SRGBColorSpace;
  for (const t of [map, normalMap]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; }
  return { map, normalMap };
}
// 小さな花を点々と置く（cell ごとに1つ候補）
function flowerAt(x, y, cell, chance) {
  const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
  if (hash2(cx + 0.31, cy + 0.77) > chance) return null;
  const fx = cx * cell + cell / 2 + (hash2(cx, cy) - 0.5) * cell * 0.5, fy = cy * cell + cell / 2 + (hash2(cy, cx) - 0.5) * cell * 0.5;
  const d = Math.hypot(x - fx, y - fy);
  if (d > 3.2) return null;
  const kind = hash2(cx * 1.7, cy * 2.3);
  const petal = kind < 0.45 ? [255, 255, 250] : kind < 0.75 ? [255, 190, 210] : [255, 235, 140];
  return { color: d < 1.2 ? [255, 206, 60] : petal, h: 0.35 };
}
const grassShade = (x, y) => {
  const n = fbm(x, y, 512), spk = hash2(x * 0.71, y * 1.13);
  const patch = fbm(x + 211, y + 97, 512, 3, 2);
  let k = 0.86 + n * 0.28 + (spk > 0.94 ? 0.07 : spk < 0.05 ? -0.07 : 0);
  let r = 142 * k, g = 200 * k, b = 104 * k;
  if (patch > 0.58) { r *= 0.9; g *= 1.02; b *= 1.08; }                 // クローバーの群れ
  const f = flowerAt(x, y, 32, 0.07);
  if (f) return [...f.color, n * 0.5 + f.h];
  return [r, g, b, n * 0.5 + spk * 0.08];
};
const leafShade = (x, y) => {
  const l = tileNoise(x / 256 * 24, y / 256 * 24, 24), n = fbm(x, y, 256, 4);
  const k = 0.72 + l * 0.42 + n * 0.16;
  const f = flowerAt(x, y, 28, 0.05);
  if (f) return [...f.color, l + f.h];
  return [96 * k, 170 * k, 86 * k, l * 0.9 + n * 0.3];
};
const woodShade = (x, y) => {
  const plank = y % 64 < 3;
  const grain = tileNoise(x / 256 * 4, y / 256 * 32, 4) * 0.6 + fbm(x, y, 256, 3) * 0.4;
  const k = plank ? 0.55 : 0.82 + grain * 0.3;
  return [206 * k, 158 * k, 104 * k, plank ? -0.5 : grain * 0.4];
};
const stoneShade = (x, y) => {
  const n = fbm(x, y, 256), k = 0.82 + n * 0.3;
  return [214 * k, 206 * k, 190 * k, n];
};
const dirtShade = (x, y) => {
  const n = fbm(x, y, 256), pebble = hash2(x * 0.53, y * 0.29) > 0.975;
  const k = pebble ? 1.15 : 0.8 + n * 0.3;
  return [170 * k, 128 * k, 92 * k, n + (pebble ? 0.3 : 0)];
};

// ================= ステージ =================
const W = 60, D = 40, CS = 0.25, GW = W / CS, GH = D / CS;
const TEAM_RGB = [null, [255, 84, 0], [30, 90, 255]];
const TEAM_HEX = [null, 0xff5400, 0x1e5aff];
const TEAM_CSS = [null, '#ffa24d', '#7ea2ff'];

const obstacles = [];
function addObstacle(cx, cz, w, d, h = 2.4) { obstacles.push({ x0: cx - w / 2, x1: cx + w / 2, z0: cz - d / 2, z1: cz + d / 2, h }); }
for (const [cx, cz, w, d] of [[13, 10, 3, 6], [13, 30, 3, 6], [21, 20, 2, 8], [24, 5, 6, 2], [24, 35, 6, 2], [8, 20, 2, 2]]) {
  addObstacle(cx, cz, w, d); addObstacle(W - cx, cz, w, d);
}
addObstacle(30, 20, 4, 4, 3.2); addObstacle(30, 10, 2, 2); addObstacle(30, 30, 2, 2);
addObstacle(16, 20, 1.6, 1.6, 1.6); addObstacle(W - 16, 20, 1.6, 1.6, 1.6);   // 石を集めるための小さな岩

const owner = new Uint8Array(GW * GH), strength = new Float32Array(GW * GH);
const blocked = new Uint8Array(GW * GH), baseOf = new Uint8Array(GW * GH), connected = new Uint8Array(GW * GH);
const CI = (gx, gz) => gx + gz * GW;
for (let gz = 0; gz < GH; gz++) for (let gx = 0; gx < GW; gx++) {
  const x = (gx + 0.5) * CS, z = (gz + 0.5) * CS, i = CI(gx, gz);
  blocked[i] = obstacles.some(o => x > o.x0 && x < o.x1 && z > o.z0 && z < o.z1) ? 1 : 0;
  baseOf[i] = x < 5 ? 1 : x > W - 5 ? 2 : 0;
}
let paintable = 0;
for (let i = 0; i < blocked.length; i++) if (!blocked[i]) paintable++;
function cellAt(x, z) {
  const gx = Math.floor(x / CS), gz = Math.floor(z / CS);
  return gx < 0 || gz < 0 || gx >= GW || gz >= GH ? -1 : CI(gx, gz);
}

let texDirty = true;
function resetGrid() {
  for (let i = 0; i < owner.length; i++) { owner[i] = baseOf[i]; strength[i] = baseOf[i] ? 1 : 0; }
  texDirty = true;
}
function paintCircle(x, z, r, team) {
  let n = 0;
  const g0x = Math.max(0, Math.floor((x - r) / CS)), g1x = Math.min(GW - 1, Math.floor((x + r) / CS));
  const g0z = Math.max(0, Math.floor((z - r) / CS)), g1z = Math.min(GH - 1, Math.floor((z + r) / CS));
  const seedA = rand() * 100;
  for (let gz = g0z; gz <= g1z; gz++) for (let gx = g0x; gx <= g1x; gx++) {
    const cx = (gx + 0.5) * CS - x, cz = (gz + 0.5) * CS - z;
    const i = CI(gx, gz);
    if (blocked[i] || (baseOf[i] && baseOf[i] !== team)) continue;
    const ang = Math.atan2(cz, cx);
    const wob = 0.8 + 0.2 * Math.sin(ang * 5 + seedA) + 0.12 * Math.sin(ang * 11 + seedA * 2);   // 飛び散ったような縁
    if (cx * cx + cz * cz > r * r * wob * wob) continue;
    if (owner[i] !== team) n++;
    owner[i] = team; strength[i] = 1;
  }
  texDirty = true;
  return n;
}

// ---- 新ルール：根（ルーツ）のつながり ----
function neighbors(i, fn) {
  const gx = i % GW;
  if (gx < GW - 1) fn(i + 1);
  if (gx > 0) fn(i - 1);
  if (i + GW < owner.length) fn(i + GW);
  if (i - GW >= 0) fn(i - GW);
}
const bfsQueue = new Int32Array(GW * GH);
function computeConnected() {
  connected.fill(0);
  let head = 0, tail = 0;
  for (let i = 0; i < owner.length; i++) if (baseOf[i]) { connected[i] = 1; bfsQueue[tail++] = i; }
  while (head < tail) {
    const i = bfsQueue[head++], t = owner[i];
    neighbors(i, n => { if (!connected[n] && owner[n] === t && !blocked[n]) { connected[n] = 1; bfsQueue[tail++] = n; } });
  }
}
function tickRoots() {
  computeConnected();
  for (let i = 0; i < owner.length; i++) {
    if (!owner[i] || baseOf[i]) continue;
    if (connected[i]) strength[i] = Math.min(1, strength[i] + 0.25);
    else { strength[i] -= 0.025; if (strength[i] <= 0) { owner[i] = 0; strength[i] = 0; } }
  }
  const grow = [];
  for (let i = 0; i < owner.length; i++) {
    if (!connected[i] || !owner[i]) continue;
    const t = owner[i];
    neighbors(i, n => { if (!owner[n] && !blocked[n] && rand() < 0.03) grow.push(n, t); });
  }
  for (let k = 0; k < grow.length; k += 2) { owner[grow[k]] = grow[k + 1]; strength[grow[k]] = 0.6; }
  texDirty = true;
}
function rootBurst(e) {
  paintCircle(e.pos.x, e.pos.z, 4.5, e.team);
  computeConnected();
  for (let step = 0; step < 12; step++) {
    const add = [];
    for (let i = 0; i < owner.length; i++) {
      if (owner[i] !== e.team || !connected[i]) continue;
      const x = (i % GW + 0.5) * CS, z = (Math.floor(i / GW) + 0.5) * CS;
      if (Math.abs(x - e.pos.x) > 14 || Math.abs(z - e.pos.z) > 14) continue;
      neighbors(i, n => { if (owner[n] !== e.team && !blocked[n] && !(baseOf[n] && baseOf[n] !== e.team)) add.push(n); });
    }
    for (const n of add) { owner[n] = e.team; strength[n] = 1; connected[n] = 1; }
  }
  texDirty = true;
}

// ---- 障害物：生け垣・木箱・丸い石・大きな木 ----
const leafTex = makeTextures(256, leafShade, 2.2);
const woodTex = makeTextures(256, woodShade, 2);
const stoneTex = makeTextures(256, stoneShade, 1.5);
const dirtTex = makeTextures(256, dirtShade, 1.5);
const texMat = (t, rx, ry, extra = {}) => {
  const map = t.map.clone(), normalMap = t.normalMap.clone();
  for (const x of [map, normalMap]) { x.repeat.set(rx, ry); x.needsUpdate = true; }
  return new THREE.MeshStandardMaterial({ map, normalMap, roughness: 0.95, ...extra });
};
const barkMat = new THREE.MeshStandardMaterial({ color: 0x9a6b45, roughness: 1 });
const petalMats = [0xffffff, 0xffb7d0, 0xffe27a, 0xc9b6ff].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 }));
const petalGeo = new THREE.SphereGeometry(0.09, 8, 6);
const shadowed = m => { m.castShadow = m.receiveShadow = true; return m; };
function addFlowersOn(cx, cz, w, d, h, count) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(petalGeo, petalMats[i % petalMats.length]);
    const side = rand();
    if (side < 0.5) m.position.set(cx + (rand() - 0.5) * (w - 0.5), h + 0.02, cz + (rand() - 0.5) * (d - 0.5));
    else if (side < 0.75) m.position.set(cx + (rand() < 0.5 ? -1 : 1) * (w / 2 + 0.02), 0.5 + rand() * (h - 0.9), cz + (rand() - 0.5) * (d - 0.6));
    else m.position.set(cx + (rand() - 0.5) * (w - 0.6), 0.5 + rand() * (h - 0.9), cz + (rand() < 0.5 ? -1 : 1) * (d / 2 + 0.02));
    m.scale.setScalar(0.8 + rand() * 0.8);
    scene.add(m);
  }
}
function makeTree(x, y, z, scale, leafColor, fruit) {
  const g = new THREE.Group();
  g.position.set(x, y, z); g.scale.setScalar(scale);
  const trunk = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 3, 10), barkMat));
  trunk.position.y = 1.5;
  g.add(trunk);
  const leaf = new THREE.MeshStandardMaterial({ color: leafColor, roughness: 0.9 });
  for (const [lx, ly, lz, r] of [[0, 3.6, 0, 1.6], [0.9, 3.2, 0.3, 1.1], [-0.8, 3.3, -0.4, 1.2], [0.1, 4.5, -0.2, 1.1]]) {
    const s = shadowed(new THREE.Mesh(new THREE.SphereGeometry(r, 18, 12), leaf));
    s.position.set(lx, ly, lz);
    g.add(s);
  }
  if (fruit) for (let i = 0; i < 6; i++) {
    const a = rand() * Math.PI * 2, f = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), fruit);
    f.position.set(Math.cos(a) * 1.45, 3.1 + rand() * 1.2, Math.sin(a) * 1.45);
    g.add(f);
  }
  scene.add(g);
  return g;
}
for (const o of obstacles) {
  const w = o.x1 - o.x0, d = o.z1 - o.z0, cx = (o.x0 + o.x1) / 2, cz = (o.z0 + o.z1) / 2;
  o.res = 'wood';   // 撃つと木材が手に入る（石だけ下で 'stone' にする）
  if (w >= 4 && d >= 4) {
    // 中央の大きな木（太い幹が当たり判定）
    const trunk = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.9, 6, 20), texMat(woodTex, 3, 1, { color: 0xb08260 })));
    trunk.position.set(cx, 3, cz);
    scene.add(trunk);
    makeTree(cx, 0, cz, 2.2, 0x8fd46b, new THREE.MeshStandardMaterial({ color: 0xff8a5c, roughness: 0.5 })).children[0].visible = false;
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * Math.PI * 2, m = new THREE.Mesh(petalGeo, petalMats[i % 4]);
      m.position.set(cx + Math.cos(a) * 2.05, 0.1, cz + Math.sin(a) * 2.05);
      m.scale.setScalar(1.5);
      scene.add(m);
    }
  } else if (w <= 2 && d <= 2) {
    if (Math.abs(cx - W / 2) < 1 || w < 2) {
      // 丸い石（撃つと石が手に入る）
      o.res = 'stone';
      const rock = shadowed(new THREE.Mesh(new THREE.DodecahedronGeometry(1.3, 2), texMat(stoneTex, 2, 2)));
      rock.scale.set(w / 2.6, o.h / 2.3, d / 2.6);
      rock.position.set(cx, o.h / 2 - 0.05, cz);
      rock.rotation.y = rand() * 3;
      scene.add(rock);
    } else {
      // 積み重ねた木箱
      for (let k = 0; k < 2; k++) {
        const crate = shadowed(new THREE.Mesh(new RoundedBoxGeometry(w - (k ? 0.15 : 0), o.h / 2, d - (k ? 0.15 : 0), 3, 0.12), texMat(woodTex, 1, 1)));
        crate.position.set(cx, o.h / 4 + k * o.h / 2, cz);
        crate.rotation.y = k * 0.2;
        scene.add(crate);
      }
    }
  } else {

function segHitsBox2D(x0, z0, x1, z1, o) {
  let t0 = 0, t1 = 1;
  for (const [p, d, lo, hi] of [[x0, x1 - x0, o.x0, o.x1], [z0, z1 - z0, o.z0, o.z1]]) {
    if (Math.abs(d) < 1e-9) { if (p < lo || p > hi) return false; continue; }
    let a = (lo - p) / d, b = (hi - p) / d;
    if (a > b) [a, b] = [b, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    if (t0 > t1) return false;
  }
  return true;
}
const lineOfSight = (a, b) => !obstacles.some(o => o.solid !== false && (o.y0 || 0) < 1 && o.h > 1 && segHitsBox2D(a.x, a.z, b.x, b.z, o));
function rayBox3D(o, d, box) {
  let t0 = 0, t1 = Infinity;
  for (const [p, v, lo, hi] of [[o.x, d.x, box.x0, box.x1], [o.y, d.y, box.y0 || 0, box.h], [o.z, d.z, box.z0, box.z1]]) {
    if (Math.abs(v) < 1e-9) { if (p < lo || p > hi) return null; continue; }
    let a = (lo - p) / v, b = (hi - p) / v;
    if (a > b) [a, b] = [b, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    if (t0 > t1) return null;
  }
  return t0;
}
function rayWorld(o, d, max) { return rayWorldHit(o, d, max).t; }
function rayWorldHit(o, d, max) {
  let t = max, hit = null;
  if (d.y < 0) t = Math.min(t, -o.y / d.y);
  for (const box of obstacles) { const h = rayBox3D(o, d, box); if (h !== null && h < t) { t = h; hit = box; } }
  return { t, hit };
}
// 足もとの高さ（坂・床・ジャンプ台の上に乗れる）
function groundAt(x, z, y) {
  let g = 0;
  for (const o of obstacles) {
    if (!o.dyn) continue;
    if (o.ramp) {
      if (x < o.x0 || x > o.x1 || z < o.z0 || z > o.z1) continue;
      const t = o.ramp.ax === 'x' ? (x - o.x0) / (o.x1 - o.x0) : (z - o.z0) / (o.z1 - o.z0);
      const hh = o.y0 + clamp(o.ramp.sign > 0 ? t : 1 - t, 0, 1) * (o.h - o.y0);
      if (y >= hh - 0.8 && hh > g) g = hh;
    } else {
      if (x + 0.3 < o.x0 || x - 0.3 > o.x1 || z + 0.3 < o.z0 || z - 0.3 > o.z1) continue;
      if (y >= o.h - 0.45 && o.h > g) g = o.h;
    }
  }
  return g;
}
function collideCircle(e) {
  const r = 0.4;
  e.pos.x = clamp(e.pos.x, r, W - r);
  e.pos.z = clamp(e.pos.z, r, D - r);
  let hit = false;
  for (const o of obstacles) {
    if (o.solid === false || e.y >= o.h - 0.45 || e.y + 1.4 <= (o.y0 || 0)) continue;
    const nx = clamp(e.pos.x, o.x0, o.x1), nz = clamp(e.pos.z, o.z0, o.z1);
    const dx = e.pos.x - nx, dz = e.pos.z - nz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    hit = true;
    if (d2 < 1e-8) {
      const pushes = [[o.x0 - r - e.pos.x, 0], [o.x1 + r - e.pos.x, 0], [0, o.z0 - r - e.pos.z], [0, o.z1 + r - e.pos.z]];
      pushes.sort((a, b) => Math.hypot(...a) - Math.hypot(...b));
      e.pos.x += pushes[0][0]; e.pos.z += pushes[0][1];
    } else {
      const d = Math.sqrt(d2);
      e.pos.x = nx + dx / d * r; e.pos.z = nz + dz / d * r;
    }
  }
  return hit;
}

function stepEntity(e, inp, dt) {
  if (!e.alive) {
    e.respawnT -= dt;
    if (e.respawnT <= 0) spawn(e);
    return;
  }
  const own = onOwnInk(e), enemyInk = onEnemyInk(e);
  if (inp.super && !superActive(e) && superCharges(e) > 0) activateSuper(e);
  const sup = superActive(e);
  if (sup) {
    e.superT = Math.max(0, e.superT - dt);
    e.ink = 100;
    if (specialOf(e).replacesWeapon) { e.charge = 0; e.hold = 0; }
  }
  e.diving = !sup && inp.dive && e.onGround && e.charge === 0;
  let speed = e.diving ? (own ? 9.5 : 2.4) : enemyInk ? 3 : 5.2;
  if (e.rolling) speed = enemyInk ? 2.5 : 4.4;
  if (e.charge > 0) speed = 2.4;
  if (sup) speed = specialOf(e).speed;
  const acc = Math.min(1, dt * 12);
  e.vel.x += (inp.mx * speed - e.vel.x) * acc;
  e.vel.z += (inp.mz * speed - e.vel.z) * acc;
  e.pos.x += e.vel.x * dt;
  e.pos.z += e.vel.z * dt;
  e.blocked = collideCircle(e);
  if (inp.jump && e.onGround) { e.vy = 7; e.onGround = false; }
  e.vy -= 22 * dt; e.y += e.vy * dt;
  const gnd = groundAt(e.pos.x, e.pos.z, e.y);
  if (e.y <= gnd) { e.y = gnd; e.vy = 0; e.onGround = true; }
  else if (e.y > gnd + 0.08) e.onGround = false;
  // ジャンプ台
  if (e.onGround) for (const o of structures) {
    if (o.kind === 'pad' && Math.abs(e.y - o.h) < 0.25 && e.pos.x > o.x0 && e.pos.x < o.x1 && e.pos.z > o.z0 && e.pos.z < o.z1) {
      e.vy = 14; e.onGround = false;
      emit({ t: 'boing', x: e.pos.x, z: e.pos.z });
    }
  }
  if (inp.build && !e.diving) doBuild(e, inp.build.piece, inp.build.mat);

  if (e.diving && own) e.ink = Math.min(100, e.ink + 55 * dt);
  else if (time - e.lastShot > 0.6) e.ink = Math.min(100, e.ink + 9 * dt);
  if (enemyInk && e.onGround && e.hp > 45 && !sup) e.hp -= 12 * dt;
  if (time - e.lastHit > 1.5) e.hp = Math.min(100, e.hp + 30 * dt);

  const target = Math.atan2(-(inp.aim.x - e.pos.x), -(inp.aim.z - e.pos.z));
  let dy = target - e.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  e.yaw += dy * Math.min(1, dt * 18);

  e.aim.copy(inp.aim);
  const muzzle = muzzleOf(e);
  const dir = inp.aim.clone().sub(muzzle).normalize();
  e.cd -= dt; e.bombCd -= dt;
  const released = e.prevFire && !inp.fire;
  e.prevFire = inp.fire;
  e.rolling = false;
  const gain = n => { e.special = Math.min(100, e.special + n * 0.025); };

  if (sup) specialTick(e, inp, dir, dt);
  if (sup && specialOf(e).replacesWeapon) {
    // 通常の武器はお休み（スペシャル武器が代わりに攻撃する）
  } else if (!e.diving) {
    if (e.weapon === 'shooter') {
      if (inp.fire && e.cd <= 0 && e.ink >= 1.2) {
        spawnBlob(e, dir, 24, 24, 0.95, 0.07);
        e.cd = 0.09; e.ink -= 1.2; e.lastShot = time;
        noise(0.06, 2400, volAt(e.pos, 0.12));
      }
    } else if (e.weapon === 'roller') {
      if (inp.fire) e.hold += dt;
      if (inp.fire && e.hold > 0.22 && e.ink > 0) {
        e.rolling = true;
        const fx = -Math.sin(e.yaw), fz = -Math.cos(e.yaw);
        if (Math.hypot(e.vel.x, e.vel.z) > 1) {
          e.ink -= 6 * dt; e.lastShot = time;
          const cx = e.pos.x + fx * 0.75, cz = e.pos.z + fz * 0.75;
          let n = 0;
          for (const k of [-1, -0.5, 0, 0.5, 1]) n += paintCircle(cx + fz * k * 0.8, cz - fx * k * 0.8, 0.45, e.team);
          gain(n);
        }
        for (const o of entities) {
          if (o.team === e.team || !o.alive) continue;
          const rx = o.pos.x - e.pos.x, rz = o.pos.z - e.pos.z;
          const along = rx * fx + rz * fz, side = Math.abs(rx * fz - rz * fx);
          if (along > 0 && along < 1.5 && side < 1.0 && Math.abs(o.y - e.y) < 1) damage(o, 400 * dt, e);
        }
      }
      if (released) {
        if (e.hold <= 0.22 && e.ink >= 9 && e.cd <= 0) {
          for (let k = -3; k <= 3; k++) {
            const a = k * 0.12, d2 = new V3(dir.x * Math.cos(a) - dir.z * Math.sin(a), dir.y + 0.25, dir.x * Math.sin(a) + dir.z * Math.cos(a));
            spawnBlob(e, d2, 15, 35, 1.1, 0.05);
          }
          e.ink -= 9; e.cd = 0.45; e.lastShot = time;
          noise(0.18, 1200, volAt(e.pos, 0.3));
        }
        e.hold = 0;
      }
    } else if (e.weapon === 'charger') {
      if (inp.fire && e.ink >= 4) e.charge = Math.min(1, e.charge + dt / 0.85);
      if (!inp.fire && e.charge > 0) {
        if (e.charge > 0.08) fireCharger(e, muzzle, dir, gain);
        e.charge = 0;
      }
    }
    if (inp.bomb && e.ink >= 50 && e.bombCd <= 0) {
      const d2 = dir.clone(); d2.y += 0.45; d2.normalize();
      spawnBlob(e, d2, 13, 0, 3.2, 0, 'bomb');
      e.ink -= 50; e.bombCd = 1; e.lastShot = time;
    }
    if (inp.special && e.special >= 100) {
      e.special = 0;
      rootBurst(e);
      emit({ t: 'blast', x: e.pos.x, y: 0.4, z: e.pos.z, team: e.team, r: 6, snd: 300 });
      emit({ t: 'special', x: e.pos.x, z: e.pos.z });
      emit({ t: 'toast', to: e.id, msg: 'ROOT BURST!', ms: 1200, size: 48 });
      emit({ t: 'feed', parts: [{ text: e.name, team: e.team }, { text: ' 🌱 ルートバースト', team: 0 }] });
    }
  } else { e.charge = 0; e.hold = 0; }
}

// 見た目（ホストでもゲストでも毎フレーム）
function updateVisual(e, dt) {
  const m = e.mesh;
  m.g.visible = e.alive;
  m.laser.visible = false;
  if (!e.alive) return;
  const own = onOwnInk(e);
  m.g.position.set(e.pos.x, e.y, e.pos.z);
  m.g.rotation.y = e.yaw + Math.PI;
  m.human.visible = !e.diving;
  m.dive.visible = e.diving;
  const sup = superActive(e), targetScale = sup ? SUPER.scale : 1;
  m.g.scale.setScalar(m.g.scale.x + (targetScale - m.g.scale.x) * Math.min(1, dt * 6));
  m.aura.visible = m.star.visible = sup;
  m.jumbo.visible = sup && specialOf(e).key === 'jumbo';
  if (sup) {
    const sp = specialOf(e);
    m.aura.material.color.set(sp.color).multiplyScalar(2.2);
    m.star.material.color.set(sp.color); m.star.material.emissive.set(sp.color);
    if (m.jumbo.visible) m.jroll.rotation.x += dt * Math.hypot(e.vel.x, e.vel.z) * 2.4;
    if (sp.key === 'dash') m.aura.scale.set(1, 1, 1.6);
    const pulse = 1 + Math.sin(time * 10) * 0.08;
    m.aura.scale.setScalar(pulse);
    m.aura.material.opacity = e.superT < 5 ? 0.04 + 0.1 * Math.abs(Math.sin(time * 12)) : 0.12;   // 残り5秒で点滅
    m.star.rotation.y += dt * 4;
  }
  if (e.diving) { m.dive.scale.set(1, own ? 0.3 : 1, 1); m.dive.position.y = own ? -0.04 : 0; }
  const moving = Math.hypot(e.vel.x, e.vel.z) > 0.5;
  e.walk += moving ? dt * Math.hypot(e.vel.x, e.vel.z) * 2.2 : 0;
  const sw = moving ? Math.sin(e.walk) * 0.6 : 0;
  m.legs[0].rotation.x = sw; m.legs[1].rotation.x = -sw;
  m.human.position.y = moving && e.onGround ? Math.abs(Math.cos(e.walk)) * 0.06 : 0;
  const lv = Math.max(0.03, e.ink / 100);
  m.liquid.scale.y = lv; m.liquid.position.y = 0.55 - 0.11 + 0.11 * lv;
  m.head.rotation.z = moving ? Math.sin(e.walk * 0.5) * 0.08 : Math.sin(time * 2 + e.pos.x) * 0.04;   // 頭をゆらゆら
  m.laser.visible = e.charge > 0;
  if (e.charge > 0) {
    const muzzle = muzzleOf(e), dir = e.aim.clone().sub(muzzle).normalize();
    const t = rayWorld(muzzle, dir, 8 + 22 * e.charge);
    const end = muzzle.clone().addScaledVector(dir, t);
    m.laser.geometry.attributes.position.array.set([muzzle.x, muzzle.y, muzzle.z, end.x, end.y, end.z]);
    m.laser.geometry.attributes.position.needsUpdate = true;
    m.laser.material.opacity = 0.25 + 0.75 * e.charge;
  }
}

function nearestEnemy(e, maxDist) {
  let best = null, bd = maxDist;
  for (const o of entities) {
    if (o.team === e.team || !o.alive) continue;
    const d = Math.hypot(o.pos.x - e.pos.x, o.pos.z - e.pos.z);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}
// スペシャル武器ごとの動き（毎フレーム）
function specialTick(e, inp, dir, dt) {
  const sp = specialOf(e), moving = Math.hypot(e.vel.x, e.vel.z) > 1;
  const fx = -Math.sin(e.yaw), fz = -Math.cos(e.yaw);
  switch (sp.key) {
    case 'cannon':
      if (inp.fire && e.cd <= 0) {
        for (const a of [-0.09, 0, 0.09]) {
          const d2 = new V3(dir.x * Math.cos(a) - dir.z * Math.sin(a), dir.y + 0.04, dir.x * Math.sin(a) + dir.z * Math.cos(a));
          spawnBlob(e, d2, 26, 45, 1.6, 0.03, 'mega');
        }
        e.cd = 0.12; e.lastShot = time;
        noise(0.12, 900, volAt(e.pos, 0.25));
      }
      for (const o of entities) if (o.team !== e.team && o.alive && Math.hypot(o.pos.x - e.pos.x, o.pos.z - e.pos.z) < 1.3) damage(o, 300 * dt, e);
      if (moving) paintCircle(e.pos.x, e.pos.z, 1.1, e.team);
      break;
    case 'storm': {
      // 0.4秒ごとに、近くの敵（いなければ自分のまわり）へ空からインク爆弾
      e.stormT = (e.stormT || 0) - dt;
      if (e.stormT <= 0) {
        e.stormT = 0.4;
        const foe = nearestEnemy(e, 16);
        const a = rand() * Math.PI * 2, r = foe ? rand() * 1.5 : 2 + rand() * 7;
        const tx = clamp((foe ? foe.pos.x : e.pos.x) + Math.cos(a) * r, 1, W - 1), tz = clamp((foe ? foe.pos.z : e.pos.z) + Math.sin(a) * r, 1, D - 1);
        const mesh = new THREE.Mesh(M('bombGeo', () => new THREE.IcosahedronGeometry(0.2, 1)), blobMats[e.team]);
        mesh.scale.setScalar(2.2);
        scene.add(mesh);
        projectiles.push({ kind: 'meteor', pos: new V3(tx, 14, tz), vel: new V3(0, -20, 0), team: e.team, owner: e, dmg: 0, paintR: 2.4, life: 0, dripT: 0, fuse: -1, mesh });
      }
      if (moving) paintCircle(e.pos.x, e.pos.z, 0.8, e.team);
      break;
    }
    case 'dash':
      if (moving) {
        paintCircle(e.pos.x, e.pos.z, 1.5, e.team);
        paintCircle(e.pos.x - e.vel.x * 0.05, e.pos.z - e.vel.z * 0.05, 1.3, e.team);
      }
      for (const o of entities) if (o.team !== e.team && o.alive && Math.hypot(o.pos.x - e.pos.x, o.pos.z - e.pos.z) < 1.6 && Math.abs(o.y - e.y) < 1.5) damage(o, 500 * dt, e);
      damageStructuresNear(e.pos.x, e.pos.z, 1.8, 3000 * dt, e);
      break;
    case 'jumbo': {
      // 前方に幅5mの巨大ローラー
      const cx = e.pos.x + fx * 1.8, cz = e.pos.z + fz * 1.8;
      if (moving || inp.fire) for (let k = -2.5; k <= 2.5; k += 0.8) paintCircle(cx + fz * k, cz - fx * k, 0.75, e.team);
      for (const o of entities) {
        if (o.team === e.team || !o.alive) continue;
        const rx = o.pos.x - e.pos.x, rz = o.pos.z - e.pos.z;
        const along = rx * fx + rz * fz, side = Math.abs(rx * fz - rz * fx);
        if (along > 0.3 && along < 2.8 && side < 2.9 && Math.abs(o.y - e.y) < 1.5) damage(o, 900 * dt, e);
      }
      damageStructuresNear(cx, cz, 2.8, 3000 * dt, e);
      if (moving && e.cd <= 0) { e.cd = 0.25; noise(0.2, 300, volAt(e.pos, 0.15)); }
      break;
    }
    case 'homing':
      if (inp.fire && e.cd <= 0) {
        spawnBlob(e, new V3(dir.x, dir.y + 0.15, dir.z).normalize(), 13, 40, 1.3, 0.25, 'homing');
        e.cd = 0.22; e.lastShot = time;
        tone(900 + rand() * 300, 0.08, volAt(e.pos, 0.1), 'sine', 1600);
      }
      break;
  }
}
function activateSuper(e) {
  e.superUsed++;
  e.superType = e.nextSuper < 0 ? Math.floor(rand() * SPECIALS.length) : e.nextSuper;
  // まだ残りがあれば、次の分をもう抽選しておく
  e.nextSuper = Math.floor(e.kills / SUPER.killsPerCharge) - e.superUsed > 0 ? Math.floor(rand() * SPECIALS.length) : -1;
  const sp = specialOf(e);
  e.superT = sp.duration;
  e.hp = 100; e.diving = false; e.charge = 0;
  paintCircle(e.pos.x, e.pos.z, 3.5, e.team);
  emit({ t: 'blast', x: e.pos.x, y: 1, z: e.pos.z, team: e.team, r: 5, snd: 250 });
  emit({ t: 'super', x: e.pos.x, z: e.pos.z });
  emit({ t: 'toast', to: e.id, msg: `${sp.emoji} ${sp.name}！`, ms: 1800, size: 44 });
  emit({ t: 'feed', parts: [{ text: e.name, team: e.team }, { text: ` ${sp.emoji} ${sp.name} 発動！`, team: 0 }] });
}
function fireCharger(e, muzzle, dir, gain) {
  const c = e.charge;
  e.ink -= 3 + 15 * c; e.lastShot = time;
  const wh = rayWorldHit(muzzle, dir, 8 + 22 * c);
  let tEnd = wh.t, hitE = null;
  for (const o of entities) {
    if (o.team === e.team || !o.alive) continue;
    const w = new V3(o.pos.x, o.y + 0.65, o.pos.z).sub(muzzle);
    const t = w.dot(dir);
    if (t < 0 || t > tEnd) continue;
    if (w.addScaledVector(dir, -t).length() < 0.6) { tEnd = t; hitE = o; }
  }
  const end = muzzle.clone().addScaledVector(dir, tEnd);
  let n = 0;
  for (let s = 0.6; s < tEnd; s += 0.3) { const p = muzzle.clone().addScaledVector(dir, s); n += paintCircle(p.x, p.z, 0.4, e.team); }
  n += paintCircle(end.x, end.z, 1.1, e.team);
  gain(n);
  if (hitE) damage(hitE, c >= 1 ? 100 : 30 + 55 * c, e);
  else if (wh.hit) hitObstacle(wh.hit, c >= 1 ? 100 : 30 + 55 * c, e);
  emit({ t: 'beam', a: muzzle.toArray(), b: end.toArray(), team: e.team });
}

function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life += dt;
    let remove = false;
    const gain = n => { p.owner.special = Math.min(100, p.owner.special + n * 0.025); };
    if (p.kind === 'meteor') {
      p.pos.addScaledVector(p.vel, dt);
      p.mesh.rotation.x += dt * 8;
      if (p.pos.y <= 0.2) {
        gain(paintCircle(p.pos.x, p.pos.z, p.paintR, p.team));
        emit({ t: 'blast', x: p.pos.x, y: 0.3, z: p.pos.z, team: p.team, r: 2.6, snd: 500 });
        damageStructuresNear(p.pos.x, p.pos.z, 2.8, 120, p.owner);
        for (const o of entities) {
          if (o.team === p.team || !o.alive) continue;
          const d = Math.hypot(o.pos.x - p.pos.x, o.pos.z - p.pos.z);
          if (d < 2.6) damage(o, d < 1.2 ? 100 : 75 * (1 - d / 2.6) + 20, p.owner);
        }
        remove = true;
      }
    } else if (p.kind === 'bomb') {
      p.mesh.rotation.x += dt * 6; p.mesh.rotation.y += dt * 4;
      if (p.fuse >= 0) {
        p.fuse -= dt;
        p.mesh.scale.setScalar(1 + Math.sin(p.life * 40) * 0.2);
        if (p.fuse <= 0) {
          gain(paintCircle(p.pos.x, p.pos.z, p.paintR, p.team));
          emit({ t: 'blast', x: p.pos.x, y: p.pos.y, z: p.pos.z, team: p.team, r: 3.2, snd: 350 });
          damageStructuresNear(p.pos.x, p.pos.z, 3.4, 110, p.owner);
          for (const o of entities) {
            if (o.team === p.team || !o.alive) continue;
            const d = Math.hypot(o.pos.x - p.pos.x, o.pos.z - p.pos.z);
            if (d < 3.2 && lineOfSight(p.pos, o.pos)) damage(o, d < 1.2 ? 100 : 70 * (1 - d / 3.2) + 15, p.owner);
          }
          remove = true;
        }
      } else {
        p.vel.y -= 22 * dt;
        p.pos.addScaledVector(p.vel, dt);
        for (const o of obstacles) {
          if (p.pos.x > o.x0 && p.pos.x < o.x1 && p.pos.z > o.z0 && p.pos.z < o.z1 && p.pos.y < o.h) {
            p.pos.addScaledVector(p.vel, -dt); p.vel.x *= -0.3; p.vel.z *= -0.3;
          }
        }
        if (p.pos.y <= 0.2) { p.pos.y = 0.2; p.vel.set(0, 0, 0); p.fuse = 0.7; }
      }
    } else {
      if (p.kind === 'homing') {
        // 一番近い敵へ向きを変える
        let best = null, bd = 22;
        for (const o of entities) {
          if (o.team === p.team || !o.alive) continue;
          const d = p.pos.distanceTo(new V3(o.pos.x, o.y + 0.7, o.pos.z));
          if (d < bd) { bd = d; best = o; }
        }
        if (best && p.life > 0.15) {
          const want = new V3(best.pos.x, best.y + 0.7, best.pos.z).sub(p.pos).normalize().multiplyScalar(14);
          if (obstacles.some(o => p.pos.x > o.x0 - 1 && p.pos.x < o.x1 + 1 && p.pos.z > o.z0 - 1 && p.pos.z < o.z1 + 1 && p.pos.y < o.h + 0.6)) want.y = 8;   // 障害物はふわっと越える
          p.vel.lerp(want, Math.min(1, dt * 4));
        } else p.vel.y -= 4 * dt;
        p.mesh.scale.setScalar(1.8 + Math.sin(p.life * 20) * 0.2);
        if (p.life > 3.5) { gain(paintCircle(p.pos.x, p.pos.z, p.paintR, p.team)); remove = true; }
      } else if (p.life > 0.16) p.vel.y -= 32 * dt;
      p.pos.addScaledVector(p.vel, dt);
      p.dripT -= dt;
      if (p.dripT <= 0 && p.pos.y < 3) { p.dripT = 0.08; gain(paintCircle(p.pos.x, p.pos.z, 0.3, p.team)); }
      for (const o of entities) {
        if (o.team === p.team || !o.alive) continue;
        const big = superActive(o) ? SUPER.scale : 1, hitR = (p.kind === 'mega' ? 0.8 : p.kind === 'homing' ? 0.7 : 0.5) * big;
        if (Math.hypot(o.pos.x - p.pos.x, o.pos.z - p.pos.z) < hitR && p.pos.y > o.y - 0.1 && p.pos.y < o.y + (o.diving ? 0.6 : 1.45 * big)) {
          damage(o, p.dmg, p.owner);
          splash(p.pos, p.team, 4);
          remove = true; break;
        }
      }
      const hitObs = !remove && p.kind !== 'homing' && obstacles.find(o => p.pos.x > o.x0 && p.pos.x < o.x1 && p.pos.z > o.z0 && p.pos.z < o.z1 && p.pos.y < o.h && p.pos.y > (o.y0 || 0) - 0.05);
      if (hitObs) hitObstacle(hitObs, p.dmg, p.owner);
      if (!remove && p.kind === 'homing') {
        const h = structures.find(o => o.team !== p.team && p.pos.x > o.x0 && p.pos.x < o.x1 && p.pos.z > o.z0 && p.pos.z < o.z1 && p.pos.y < o.h && p.pos.y > o.y0);
        if (h && h.kind === 'decoy') { damageStructure(h, p.dmg, p.owner); remove = true; }
      }
      if (!remove && (p.pos.y <= 0 || hitObs)) {
        gain(paintCircle(p.pos.x, p.pos.z, p.paintR, p.team));
        if (rand() < 0.3) splash(new V3(p.pos.x, 0.05, p.pos.z), p.team, 2, 2.5);
        remove = true;
      }
    }
    if (p.pos.x < -5 || p.pos.x > W + 5 || p.pos.z < -5 || p.pos.z > D + 5 || p.pos.y < -3) remove = true;
    if (remove) { scene.remove(p.mesh); projectiles.splice(i, 1); }
    else p.mesh.position.copy(p.pos);
  }
}

// ================= 建築 =================
const MAX_MAT = 99;
const PIECES = [
  { key: 'wall', name: '壁', emoji: '🧱', cost: m => ({ [m]: 10 }), usesMat: true },
  { key: 'ramp', name: '坂', emoji: '📐', cost: m => ({ [m]: 10 }), usesMat: true },
  { key: 'floor', name: '床', emoji: '⬜', cost: m => ({ [m]: 10 }), usesMat: true },
  { key: 'tower', name: 'タワー', emoji: '🗼', cost: () => ({ wood: 10, stone: 10 }) },
  { key: 'pad', name: 'ジャンプ台', emoji: '🔼', cost: () => ({ stone: 10 }) },
  { key: 'decoy', name: 'おとり', emoji: '🎎', cost: () => ({ wood: 15 }) },
];
const structures = [];
let structSeq = 0;
const boxesOverlap = (a, b) => a.x0 < b.x1 - 0.02 && a.x1 > b.x0 + 0.02 && a.z0 < b.z1 - 0.02 && a.z1 > b.z0 + 0.02 && a.y0 < b.h - 0.02 && a.h > (b.y0 || 0) + 0.02;
// 目の前のどこに建つかを計算（ホストの建築と、プレイヤーの予告表示で共通）
function planBuild(e, pieceIndex, mat) {
  const P = PIECES[pieceIndex];
  if (!P) return null;
  const fx = -Math.sin(e.yaw), fz = -Math.cos(e.yaw);
  const ax = Math.abs(fx) > Math.abs(fz) ? 'x' : 'z', sign = (ax === 'x' ? fx : fz) > 0 ? 1 : -1;
  const base = Math.max(0, Math.floor((e.y + 0.3) / 2.4) * 2.4);
  const cell = v => Math.floor(v / 2) * 2 + 1;
  const s = { kind: P.key, mat: P.usesMat ? mat : P.key === 'pad' ? 'stone' : 'wood', team: e.team, owner: e.id, ax, sign, yaw: e.yaw, species: speciesOf(e.id) };
  if (P.key === 'wall') {
    if (ax === 'x') { const x = Math.round((e.pos.x + sign * 1.6) / 2) * 2, z = cell(e.pos.z); Object.assign(s, { x0: x - 0.15, x1: x + 0.15, z0: z - 1, z1: z + 1 }); }
    else { const z = Math.round((e.pos.z + sign * 1.6) / 2) * 2, x = cell(e.pos.x); Object.assign(s, { x0: x - 1, x1: x + 1, z0: z - 0.15, z1: z + 0.15 }); }
    s.y0 = base; s.h = base + 2.4;
  } else {
    const cx = cell(e.pos.x + (ax === 'x' ? sign * 2 : 0)), cz = cell(e.pos.z + (ax === 'z' ? sign * 2 : 0));
    const half = { ramp: 1, floor: 1, tower: 0.45, pad: 0.8, decoy: 0.4 }[P.key];
    Object.assign(s, { x0: cx - half, x1: cx + half, z0: cz - half, z1: cz + half });

function chooseTarget(b) {
  let best = null, bestScore = Infinity;
  for (let k = 0; k < 24; k++) {
    const gx = Math.floor(rand() * GW), gz = Math.floor(rand() * GH), i = CI(gx, gz);
    if (blocked[i] || owner[i] === b.team) continue;
    const x = (gx + 0.5) * CS, z = (gz + 0.5) * CS;
    let s = Math.hypot(x - b.pos.x, z - b.pos.z);
    if (owner[i]) s -= connected[i] ? 10 : 4;          // 敵の生きた根を切りに行く
    for (const dd of [4, -4, 4 * GW, -4 * GW]) {
      const n = i + dd;
      if (n >= 0 && n < owner.length && owner[n] === b.team && connected[n]) { s -= 8; break; }   // 自分の根の先を伸ばす
    }
    s += rand() * 6;
    if (s < bestScore) { bestScore = s; best = new V3(x, 0, z); }
  }

}
function botInput(b, dt) {
  const ai = b.ai;
  const inp = { mx: 0, mz: 0, aim: new V3(), fire: false, bomb: false, special: false, dive: false, jump: false };
  if (!b.alive) return inp;
  let foe = null, fd = 16;
  for (const o of entities) {
    if (o.team === b.team || !o.alive || isHidden(o)) continue;
    const d = Math.hypot(o.pos.x - b.pos.x, o.pos.z - b.pos.z);
    if (d < fd && lineOfSight(b.pos, o.pos)) { fd = d; foe = o; }
  }
  for (const o of structures) {   // 敵のおとり人形にもだまされる
    if (o.kind !== 'decoy' || o.team === b.team) continue;
    const d = Math.hypot(o.target.pos.x - b.pos.x, o.target.pos.z - b.pos.z);
    if (d < fd + 3 && lineOfSight(b.pos, o.target.pos)) { fd = d; foe = o.target; }
  }
  ai.think -= dt;
  ai.stuckT += dt;
  if (ai.stuckT > 1) {
    if (ai.lastPos.distanceTo(b.pos) < 0.5 && !foe) chooseTarget(b);
    ai.lastPos.copy(b.pos); ai.stuckT = 0;
  }
  if (ai.think <= 0) {
    ai.think = 0.5 + rand() * 0.7;
    if (rand() < 0.3) ai.strafe *= -1;
    if (!ai.target || Math.hypot(ai.target.x - b.pos.x, ai.target.z - b.pos.z) < 1.5) chooseTarget(b);
    ai.wantCharge = 0.4 + rand() * 0.5;
  }
  const move = (tx, tz, k = 1) => { const d = Math.hypot(tx, tz) || 1; inp.mx += tx / d * k; inp.mz += tz / d * k; };

  if (foe) {
    const dx = foe.pos.x - b.pos.x, dz = foe.pos.z - b.pos.z;
    inp.aim.set(foe.pos.x + foe.vel.x * 0.15, foe.y + 0.65, foe.pos.z + foe.vel.z * 0.15);
    const want = b.weapon === 'charger' ? 14 : b.weapon === 'roller' ? 0 : 6;
    if (fd > want + 2) move(dx, dz); else if (fd < want - 2) move(-dx, -dz);
    move(-dz * ai.strafe, dx * ai.strafe, b.weapon === 'roller' ? 0.2 : 0.8);
    if (superActive(b)) { inp.fire = fd < 16; move(dx, dz); if (specialOf(b).key === 'dash' || specialOf(b).key === 'jumbo') move(dx, dz, 1.5); }
    else if (b.weapon === 'shooter') inp.fire = fd < 11 && b.ink > 2;
    else if (b.weapon === 'roller') inp.fire = fd < 7 || b.hold > 0;
    else inp.fire = b.charge < (fd < 8 ? 0.5 : 1) && b.ink > 5;
    if (b.ink > 70 && fd > 4 && fd < 11 && rand() < dt * 0.4) inp.bomb = true;
    if (time - b.lastHit < 0.3 && b.hp < 70 && fd > 3 && rand() < 0.08) inp.build = { piece: 0, mat: b.stone >= 10 && rand() < 0.4 ? 'stone' : 'wood' };   // 撃たれたら壁で守る
    else if (b.wood >= 25 && fd > 6 && rand() < dt * 0.05) inp.build = { piece: 5, mat: 'wood' };
    if (b.special >= 100 && rand() < dt) inp.special = true;
    if (superCharges(b) > 0 && fd < 12 && rand() < dt * 0.8) inp.super = true;
  } else {
    if (!ai.target) chooseTarget(b);
    const t = ai.target;
    if (b.ink < 12) b.retreat = true;
    if (b.retreat) {
      if (onOwnInk(b)) { inp.dive = true; if (b.ink > 90) b.retreat = false; }
      else move((b.team === 1 ? 0 : W) - b.pos.x, 0);

    } else {
      const tx = t.x - b.pos.x, tz = t.z - b.pos.z, d = Math.hypot(tx, tz);

      else if (b.weapon === 'charger') inp.fire = b.charge < ai.wantCharge;
      else inp.fire = true;

      if (b.wood >= 20 && b.stone >= 10 && rand() < dt * 0.04) inp.build = { piece: 3, mat: 'wood' };
      if (b.special >= 100 && rand() < dt * 0.5) inp.special = true;
    }
  }

}

    stepEntity(e, inp, dt);
  }
  updateProjectiles(dt);
  updateStructures(dt);
  rootT -= dt;
  if (rootT <= 0) { rootT = 0.5; tickRoots(); }
}
function matchStep(dt) {
  simulate(dt);
  matchLeft -= dt;
  if (net.mode === 'host') {
    net.sendT -= dt;
    if (net.sendT <= 0 || matchLeft <= 0) { net.sendT = 1 / 20; hostSend(); }
  }
  if (matchLeft <= 0) {
    if (net.mode === 'host') broadcast({ t: 'end' });
    endMatch();
  }
}
// ホストのタブが裏に回ると描画ループが止まるので、Workerのタイマーで試合の計算だけ続ける
let lastHidden = performance.now();
try {
  const ticker = new Worker(URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 33)'], { type: 'text/javascript' })));
  ticker.onmessage = () => {
    const t = performance.now(), dt = Math.min((t - lastHidden) / 1000, 0.1);
    lastHidden = t;
    if (!document.hidden) return;
    netKeepAlive(dt);
    for (let left = dt; left > 1e-4 && state === 'play' && net.mode === 'host'; left -= 1 / 30) matchStep(Math.min(left, 1 / 30));
  };
} catch {}
function netKeepAlive(dt) {
  net.pingT -= dt;
  if (net.pingT > 0) return;
  net.pingT = 3;
  const t = performance.now();
  if (net.mode === 'host') {
    if (state !== 'play') broadcast({ t: 'ping' });
    for (const [id, c] of net.conns) if (c.relay && t - (c.lastSeen || t) > 12000) hostDrop(id);
  } else if (net.mode === 'client' && net.conn?.relay) {
    if (state !== 'play') net.conn.send({ t: 'ping' });
    if (t - net.hostSeen > 12000) { showTitle(); toast('ホストとの接続が切れました', 2200, 28); }
  }
}
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  netKeepAlive(dt);
  if (state === 'play') {
    if (net.mode === 'client') { time += dt; clientTick(dt); }
    else if (net.mode === 'host' || !paused) matchStep(dt);
    if (player) updateCamera();
  } else {
    if (state === 'title' || state === 'lobby') { simulate(dt); netEvents = []; }
    if (state === 'end' && net.mode === 'client') clientTick(dt);
    const a = now / 14000;
    camera.fov = 55; camera.updateProjectionMatrix();
    camera.position.set(W / 2 + Math.sin(a) * 42, 20, D / 2 + Math.cos(a) * 34);
    camera.lookAt(W / 2, 0, D / 2);
  }
  for (const e of entities) updateVisual(e, dt);
  animateStructures(dt);
  updateGhost();
  if (testMode && window.__camHook) window.__camHook(camera, entities);
  clouds.rotation.y += dt * 0.004;
  updateEffects(dt);
  if (texDirty) updateTexture();
  hudT -= dt;
  if (hudT <= 0 && state === 'play' && player) { hudT = 0.1; drawMinimap(); updateHud(); }
  composer.render();
  requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
if (testMode) window.__game = { structures, doBuild, groundAt, planBuild, damageStructure, get player() { return player; }, get entities() { return entities; }, score, net, get state() { return state; }, look(y, p) { camYaw = y; camPitch = p; } };
</script>
